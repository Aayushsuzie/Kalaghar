<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Class - KalaGhar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .required {
            color: #dc3545;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-right: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <script>
        // Check authentication
        const token = localStorage.getItem('authToken');
        const userRole = localStorage.getItem('userRole');
        const userId = localStorage.getItem('userId');

        if (!token || userRole !== 'teacher' || !userId) {
            alert('Please login as a teacher first');
            window.location.href = 'login.html';
        }
    </script>

    <div class="container">
        <div class="header">
            <h1>📚 Post a New Class</h1>
            <p>Share your knowledge with eager learners</p>
        </div>

        <div class="content">
            <div id="message" class="message"></div>

            <form id="postClassForm">
                <!-- Basic Information -->
                <div class="section">
                    <h2 class="section-title">📝 Basic Information</h2>

                    <div class="form-group">
                        <label>Class Name <span class="required">*</span></label>
                        <input type="text" id="className" placeholder="e.g., Beginner Guitar Masterclass" required>
                        <div class="hint">Give your class an engaging, descriptive title</div>
                    </div>

                    <div class="form-group">
                        <label>Subject/Skill <span class="required">*</span></label>
                        <select id="skill" required>
                            <option value="">Select a skill</option>
                            <optgroup label="Music">
                                <option value="Guitar">Madal</option>
                                <option value="Piano">Basuri/Murali</option>
                                
                                <option value="Drums">Drums</option>
                                <option value="Vocal">Vocal</option>
                            </optgroup>
                            
                            <optgroup label="Languages">
                                <option value="English">Newari</option>
                                <option value="Spanish">Tamang</option>
                                <option value="French">French</option>
                                <option value="Hindi">Hindi</option>
                                <option value="Nepali">Nepali</option>
                            </optgroup>
                            <optgroup label="Arts & Fitness">
                                <option value="Painting">Painting</option>
                                <option value="Drawing">Drawing</option>
                                <option value="Dance">Dance</option>
                                <option value="Yoga">Yoga</option>
                            </optgroup>
                            <optgroup label="Other">
                                <option value="Cooking">Cooking</option>
                                <option value="Photography">Photography</option>
                                <option value="Programming">Programming</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description <span class="required">*</span></label>
                        <textarea id="description" placeholder="Describe what students will learn, teaching methodology, and class objectives..." required></textarea>
                        <div class="hint">Minimum 20 characters</div>
                    </div>
                </div>

                <!-- Schedule -->
                <div class="section">
                    <h2 class="section-title">📅 Schedule</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Class Date <span class="required">*</span></label>
                            <input type="date" id="classDate" required>
                        </div>

                        <div class="form-group">
                            <label>Max Students <span class="required">*</span></label>
                            <input type="number" id="maxStudents" min="1" max="50" value="10" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Time <span class="required">*</span></label>
                            <input type="time" id="startTime" required>
                        </div>

                        <div class="form-group">
                            <label>End Time <span class="required">*</span></label>
                            <input type="time" id="endTime" required>
                        </div>
                    </div>
                </div>

                <!-- Student Requirements -->
                <div class="section">
                    <h2 class="section-title">👥 Student Requirements</h2>

                    <div class="form-group">
                        <label>Student Level <span class="required">*</span></label>
                        <select id="studentLevel" required>
                            <option value="">Select level</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                            <option value="all-levels">All Levels</option>
                        </select>
                    </div>
                </div>

                <!-- Pricing -->
                <div class="section">
                    <h2 class="section-title">💰 Pricing</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Price (NPR) <span class="required">*</span></label>
                            <input type="number" id="price" min="0" step="50" placeholder="1000" required>
                        </div>

                        <div class="form-group">
                            <label>Price Type</label>
                            <select id="priceType">
                                <option value="per-class">Per Class</option>
                                <option value="per-hour">Per Hour</option>
                                <option value="per-student">Per Student</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Location -->
                <div class="section">
                    <h2 class="section-title">📍 Location</h2>

                    <div class="form-group">
                        <label>Class Location <span class="required">*</span></label>
                        <select id="locationType" required>
                            <option value="">Select location type</option>
                            <option value="teacher-location">At My Location</option>
                            <option value="student-location">At Student's Location</option>
                            
                        </select>
                    </div>
                </div>

                <!-- Submit Buttons -->
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='teacher-dashboard.html'">Cancel</button>
                    <button type="button" class="btn btn-secondary" onclick="saveDraft()">Save as Draft</button>
                    <button type="submit" class="btn btn-primary">Publish Class</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        const TEACHER_ID = localStorage.getItem('userId');

        // Set minimum date to today
        document.getElementById('classDate').min = new Date().toISOString().split('T')[0];

        // Form submission
        document.getElementById('postClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await createClass('published');
        });

        async function saveDraft() {
            await createClass('draft');
        }

        async function createClass(status) {
  const messageDiv = document.getElementById('message');
  messageDiv.style.display = 'none';

  // Validate description length
  const description = document.getElementById('description').value;
  if (description.length < 20) {
    messageDiv.className = 'message error';
    messageDiv.textContent = '❌ Description must be at least 20 characters';
    messageDiv.style.display = 'block';
    return;
  }

  try {
    // ========================================
    // Calculate duration in minutes
    // ========================================
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;

    const [startHour, startMin] = startTime.split(':').map(Number);
    const [endHour, endMin] = endTime.split(':').map(Number);

    const startTotalMin = startHour * 60 + startMin;
    const endTotalMin = endHour * 60 + endMin;
    const durationMinutes = endTotalMin - startTotalMin;

    // Validate duration
    if (durationMinutes <= 0) {
      messageDiv.className = 'message error';
      messageDiv.textContent = '❌ End time must be after start time';
      messageDiv.style.display = 'block';
      return;
    }

    console.log('Duration calculated:', durationMinutes, 'minutes');

    // ========================================
    // Build form data
    // ========================================
    const formData = {
      teacherId: TEACHER_ID,
      className: document.getElementById('className').value,
      description: description,
      skill: document.getElementById('skill').value,
      schedule: {
        date: document.getElementById('classDate').value,
        startTime: startTime,
        endTime: endTime,
        durationMinutes: durationMinutes,  // ← NOW INCLUDED!
        isRecurring: false
      },
      studentLevel: document.getElementById('studentLevel').value,
      maxStudents: parseInt(document.getElementById('maxStudents').value),
      pricing: {
        amount: parseFloat(document.getElementById('price').value),
        priceType: document.getElementById('priceType').value
      },
      location: {
        type: document.getElementById('locationType').value
      },
      status: status
    };

    console.log('Creating class with duration:', formData);

    // ========================================
    // Send to backend
    // ========================================
    const response = await fetch(`${API_URL}/api/classes`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    });

    const result = await response.json();
    console.log('Response:', result);

    if (result.success) {
      messageDiv.className = 'message success';
      messageDiv.textContent = status === 'published' 
        ? '✅ Class published successfully! Redirecting to dashboard...'
        : '✅ Draft saved! Redirecting to dashboard...';
      messageDiv.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'teacher-dashboard.html';
      }, 2000);
    } else {
      throw new Error(result.message);
    }

  } catch (error) {
    console.error('Error:', error);
    messageDiv.className = 'message error';
    messageDiv.textContent = '❌ ' + error.message;
    messageDiv.style.display = 'block';
  }
}
    </script>
</body>
</html>
