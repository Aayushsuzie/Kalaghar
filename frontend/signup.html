<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KalaGhar – Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">KalaGhar</div>
      <div class="nav-actions">
        <a href="index.html" class="btn-link">Home</a>
        <a href="login.html" class="btn-primary small">Log in</a>
      </div>
    </header>

    <main class="section auth-section-page">
      <h2>Sign up</h2>
      <form id="signup-form" class="form">
        <label>
          Full name
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <label>
          I am a
          <select name="role" required>
            <option value="" disabled selected>Select your role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </label>
        <label>
          Location (optional)
          <input type="text" name="location" placeholder="City, Country" />
        </label>
        <button type="submit" class="btn-primary">Create account</button>
        <p class="form-message" id="signup-message"></p>
      </form>
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Kalaghar. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
  </html>
